name: Build iPhone
on:
  workflow_dispatch:
    inputs:
      skip_simulator:
        description: Build IPA without simulator UI tests (manual device testing)
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Gateway tests
        run: python3 -m unittest discover -s bridge -v
      - name: Runtime catalog projection tests
        run: node --test tests/catalog.test.mjs
      - name: Native model regression tests
        run: |
          mkdir -p build
          xcrun swiftc -parse-as-library ios/Models.swift ios/MessageBlocks.swift tests/ModelsTest.swift -o build/models-test
          build/models-test
          xcrun swiftc -parse-as-library -framework CryptoKit ios/HistoryCache.swift tests/CachePolicyTests.swift -o build/cache-test
          build/cache-test
          xcrun swiftc -parse-as-library ios/RealtimeProtocol.swift ios/VoiceDiagnostics.swift tests/VoiceProtocolTests.swift -o build/voice-test
          build/voice-test
          xcrun swiftc -parse-as-library -framework CryptoKit ios/Models.swift ios/WorkflowPolicies.swift ios/PrivateActivity.swift ios/TaskHistory.swift ios/VerifiedUpdate.swift tests/WorkflowTests.swift -o build/workflow-test
          build/workflow-test
      - name: Native preference persistence tests
        run: |
          xcrun swiftc -parse-as-library -framework CryptoKit ios/Models.swift ios/RemoteFiles.swift ios/PinStore.swift ios/ProjectFavorites.swift ios/DraftStore.swift ios/InboxLocalFiles.swift tests/StoreTests.swift -o build/stores-test
          build/stores-test
      - name: Native chat history and follow regression tests
        run: |
          TARGET="$(uname -m)-apple-macos13.0"
          xcrun swiftc -swift-version 5 -target "$TARGET" -parse-as-library ios/Models.swift ios/ChatStore.swift tests/ChatStoreTests.swift -o build/chat-store-test
          python3 -c 'import subprocess; subprocess.run(["build/chat-store-test"], timeout=30, check=True)'
          xcrun swiftc -swift-version 5 -parse-as-library ios/ChatScrollState.swift tests/ChatScrollTests.swift -o build/chat-scroll-test
          build/chat-scroll-test
          # Red/green proof while the unmodified 0.12.0 baseline is in shallow history.
          BASELINE=2c4ef0c0e75d17b5127d7be92818c2f1b7a5a69e
          if git cat-file -e "$BASELINE:ios/ChatStore.swift" 2>/dev/null; then
            git show "$BASELINE:ios/ChatStore.swift" > build/legacy-chat-store.swift
            xcrun swiftc -swift-version 5 -target "$TARGET" -parse-as-library ios/Models.swift build/legacy-chat-store.swift tests/ChatStoreTests.swift -o build/legacy-chat-store-test
            python3 -c 'import subprocess; p = subprocess.run(["build/legacy-chat-store-test"], timeout=30, text=True, capture_output=True); print(p.stdout); assert p.returncode == 1 and "FAIL: opening chat loads history" in p.stdout and "FAIL: newer assistant-only stream" in p.stdout, "Legacy fixture did not reproduce expected regressions"'
          fi
      - name: Build native iPhone IPA
        run: bash scripts/build-ios.sh
      - name: Launch native app in iPhone simulator
        if: ${{ !inputs.skip_simulator }}
        run: bash scripts/simulator-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OpenCode-Pocket-iPhone
          path: |
            build/OpenCode-Pocket-unsigned.ipa
            build/iphone-*.png
          retention-days: 7
