name: Build iPhone
on:
  workflow_dispatch:
    inputs:
      skip_simulator:
        description: Build IPA without simulator UI tests (manual device testing)
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Gateway tests
        run: python3 -m unittest discover -s bridge -v
      - name: Native model regression tests
        run: |
          mkdir -p build
          xcrun swiftc -parse-as-library ios/Models.swift tests/ModelsTest.swift -o build/models-test
          build/models-test
          xcrun swiftc -parse-as-library -framework CryptoKit ios/HistoryCache.swift tests/CachePolicyTests.swift -o build/cache-test
          build/cache-test
      - name: Native preference persistence tests
        run: |
          xcrun swiftc -parse-as-library -framework CryptoKit ios/Models.swift ios/RemoteFiles.swift ios/PinStore.swift ios/DraftStore.swift ios/InboxLocalFiles.swift tests/StoreTests.swift -o build/stores-test
          build/stores-test
      - name: Build native iPhone IPA
        run: bash scripts/build-ios.sh
      - name: Launch native app in iPhone simulator
        if: ${{ !inputs.skip_simulator }}
        run: bash scripts/simulator-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OpenCode-Pocket-iPhone
          path: |
            build/OpenCode-Pocket-unsigned.ipa
            build/iphone-*.png
          retention-days: 7
