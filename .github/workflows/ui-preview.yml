name: iPhone UI preview
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Preview suite
        type: choice
        options: [full, call]
        default: full
permissions:
  contents: read
jobs:
  preview:
    runs-on: macos-15
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Build and capture native simulator screens
        env:
          SNAPSHOTS_ONLY: '1'
          UI_INTERACTIONS: ${{ inputs.suite == 'call' && '0' || '1' }}
          UI_SCREEN_LIST: ${{ inputs.suite == 'call' && 'call-active' || 'conversation sidebar call call-active live chat' }}
        run: bash scripts/simulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-UI-preview
          path: build/iphone-*.png
          if-no-files-found: warn
          retention-days: 7
